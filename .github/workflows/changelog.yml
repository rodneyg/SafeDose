name: Publish changelog
on:
  pull_request_target:
    types: [closed]
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'skip-changelog') && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Update published changelog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/publish-changelog.py
            npm run changelog:build
            if git diff --quiet && test -z "$(git ls-files --others --exclude-standard -- changelog lib/changelog.json)"; then exit 0; fi
            git add changelog lib/changelog.json
            git commit -m "docs: publish changelog for PR #${{ github.event.pull_request.number }}"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo '::error::Could not update main after five attempts.'
          exit 1

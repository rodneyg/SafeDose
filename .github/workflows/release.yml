name: Tag and release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    # Changelog publishes are a follow-up commit from the existing changelog
    # workflow, not a merge. Skip them so we do not create a second tag.
    if: >-
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'docs: publish changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create semver tag and GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python3 scripts/create-release.py
